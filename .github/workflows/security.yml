name: Security

on:
    push:
        branches: [main]
    schedule:
        - cron: '0 6 * * 1'   # weekly, Mondays 06:00 UTC

jobs:
    # CodeQL needs GitHub code scanning enabled; static analysis runs via
    # semgrep in Docker instead — scans PHP + JS, prints findings to the job
    # log. Add `--error` once the baseline has been reviewed to make
    # findings gate the pipeline.
    semgrep:
        name: semgrep scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Semgrep (docker)
              run: |
                  set -o pipefail
                  docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
                    semgrep scan \
                      --config p/security-audit \
                      --metrics off \
                      --exclude vendor \
                      --exclude tests/Fixtures 2>&1 | tee semgrep.log
                  rc=$?
                  {
                    echo "## Semgrep — security audit"
                    echo '```'
                    tail -n 25 semgrep.log
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit $rc

    deps:
        name: dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer
            - run: composer install --no-interaction --prefer-dist
            - name: Composer audit
              run: |
                  set -o pipefail
                  composer audit 2>&1 | tee audit.log
                  rc=$?
                  {
                    echo "## Composer audit"
                    echo '```'
                    tail -n 15 audit.log
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit $rc

    gitleaks:
        name: secret scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v2
              id: gitleaks
              env:
                  GITLEAKS_CONFIG: .gitleaks.toml
            - name: Gitleaks summary
              if: always()
              run: |
                  {
                    echo "## Gitleaks — secret scan"
                    echo '```'
                    echo "result: ${{ steps.gitleaks.outcome }}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
